add_newline = true
command_timeout = 200

palette = 'ansi16'

format = "[$directory$git_branch$git_status]($style)$character"

[palettes.ansi16]
success_fg = 'bright-green'
error_fg = 'bright-red'
fg_1 = 'bright-blue'
bg_1 = 'black'
fg_2 = 'bright-magenta'
bg_2 = 'bright-black'
fg_3 = 'black'
bg_3 = 'cyan'
fg_4 = 'black'
bg_4 = 'green'
fg_5 = 'black'
bg_5 = 'yellow'
fg_6 = 'black'
bg_6 = 'bright-yellow'

[character]
success_symbol = "[❯](fg:success_fg)"
error_symbol = "[✗](fg:error_fg)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "fg:fg_1"
read_only = " 󰌾"
read_only_style = "fg:error_fg"

[git_branch]
format = "[$branch]($style) "
style = "fg:fg_2"
symbol = "\ue0a0 "

[git_status]
format = '[$all_status$ahead_behind]($style) '
style = "fg:bright-yellow"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
conflicted = "= "
up_to_date = "✓ "
untracked = "? "
modified = "! "
stashed = "$ "
staged = "+ "
renamed = "→ "
deleted = "✘ "

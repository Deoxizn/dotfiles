config_version = 15

[audio]
enable_sounds = false

[bar.default]
background_opacity = 0.0
capsule = true
capsule_fill = "surface_variant"
capsule_thickness = 0.76000000000000001
concave_edge_corners = false
contact_shadow = true
end = [
    "cpurr",
    "bongocat",
    "clipboard",
    "tray",
    "network",
    "sysmon-cpu",
    "sysmon-temp",
    "sysmon-ram",
    "network_rx",
    "network_tx",
    "sysmon-disk",
    "volume",
    "notifications",
    "bluetooth",
    "yuuto/arch-updater:widget",
    "control-center"
]
margin_edge = 10
margin_ends = 10
padding = 10
panel_overlap = 1
radius = 16
widget_spacing = 4

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1440.0
    cy = 1415.25
    output = "DP-1"
    placement_height = 1620.0
    placement_width = 2880.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 540.0
    cy = 1596.4444580078125
    output = "HDMI-A-1"
    placement_height = 1920.0
    placement_width = 1080.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."yuuto/arch-updater"]
aur_helper = "auto"
auto_check_hours = 1
flatpak_enabled = false
terminal = "kitty --app-id=TUI.float"
update_cmd = "hexciri-update"
update_mode = "terminal"

[plugins]
enabled = [ "yuuto/arch-updater", "noctalia/bongocat", "deoxizn/cpurr" ]

[shell.launcher]
categories = false
compact = true
default_view = "all"
layout = "simple"
sort_by_usage = false

[shell.screenshot]
directory = "~/Pictures/Screenshots"

[theme]
custom_palette = "hexciri"
source = "custom"

[wallpaper.default]
path = "/home/devi/.local/state/hexciri/current/theme/backgrounds/zz-user-wallpapers--mnt-Photos-wallpapers-wallhaven-3q3z59.jpg"

[wallpaper.last]
path = "/home/devi/.local/state/hexciri/current/theme/backgrounds/zz-user-wallpapers--mnt-Photos-wallpapers-wallhaven-kx996m.jpg"

[wallpaper.monitors.DP-1]
path = "/home/devi/.local/state/hexciri/current/theme/backgrounds/zz-user-wallpapers--mnt-Photos-wallpapers-wallhaven-kx996m.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/devi/.local/state/hexciri/current/theme/backgrounds/zz-user-wallpapers--mnt-Photos-wallpapers-wallhaven-3q3z59.jpg"

[weather]
unit = "imperial"

[widget.clipboard]
enabled = false

[widget.media]
art_size = 20
max_length = 420

[widget.network]
enabled = false

[widget.sysmon-cpu]
stat = "cpu_temp"
visualization = "gauge"

[widget.sysmon-temp]
stat = "gpu_temp"

[widget.volume]
enabled = false
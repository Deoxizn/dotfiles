# Noctarchy — Noctalia config
# https://github.com/deoxizn/noctarchy

# ──────────────────────────────────────────────
# General
# ──────────────────────────────────────────────

[general]
terminal = "kitty"
launcher = "fuzzel"
file_manager = "nautilus"
browser = "brave-origin-beta"

# ──────────────────────────────────────────────
# Shell
# ──────────────────────────────────────────────

[shell]
time_format = "{:%-I:%M %p}"

[shell.animation]
enabled = false

# ──────────────────────────────────────────────
# Bar
# ──────────────────────────────────────────────

[bar.default]
position = "top"
height = 40
opacity = 0.95
exclusive = true
start  = ["launcher", "wallpaper", "workspaces", "separator", "active-window"]
center = ["clock"]
end    = ["bongocat", "notifications", "clipboard", "media", "tray", "network", "bluetooth", "brightness", "battery", "yuuto/arch-updater:widget", "sysmon-cpu", "sysmon-ram", "sysmon-temp", "sysmon-disk", "sysmon-net", "control-center"]

[bar.default.monitor.HDMI-A-1]
match = "HDMI-A-1"
start  = ["workspaces"]
center = []
end    = []

[bar.widgets]
enabled = false

[widget.clock]
format = "{:%-I:%M %p}"
tooltip_format = "{:%A, %B %d, %Y}"

[bar.widgets.workspaces]
persistent = [1, 2, 3, 4, 5]

[widget.bongocat]
type = "noctalia/bongocat:cat"
input_devices = [
  "/dev/input/by-id/usb-Keychron_Keychron_Q6_Max-event-kbd",
  "/dev/input/by-id/usb-Keychron_Keychron_Link-if02-event-kbd",
]
audio_spectrum = true
tappy_mode = true
rave_mode = false
use_mpris_filter = false

[bar.widgets.battery]
critical_threshold = 15
warning_threshold = 30
show_percentage = true

[bar.widgets.network]
show_wifi = true
show_wired = true
show_vpn = true

[bar.widgets.media]
show_album_art = true
max_title_length = 40

[bar.widgets.volume]
show_percentage = true

[bar.widgets.brightness]
show_percentage = true

[widget.sysmon-cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "graph"
show_value = true

[widget.sysmon-ram]
type = "sysmon"
stat = "ram_pct"
show_value = true

[widget.sysmon-temp]
type = "sysmon"
stat = "cpu_temp"
show_value = true

[widget.sysmon-disk]
type = "sysmon"
stat = "disk_used_pct"
path = "/"
show_value = true

[widget.sysmon-net]
type = "sysmon"
stat = "net_rx"
network_speed_compact = true
show_value = true

# ──────────────────────────────────────────────
# System Monitor
# ──────────────────────────────────────────────

[system.monitor]
enabled = true
cpu_poll_seconds = 2.0
gpu_poll_seconds = 5.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0
disk_poll_seconds = 10.0

# ──────────────────────────────────────────────
# Launcher
# ──────────────────────────────────────────────

[launcher]
command = "fuzzel"
width = 600
height = 400

# ──────────────────────────────────────────────
# Notifications
# Per https://docs.noctalia.dev/noctalia/services/notifications/
# monitors = [] clones to all outputs (default). Set to ["DP-1"] to
# suppress toasts on HDMI-A-1 (portrait). Falls back to all if DP-1 disconnected.
# ──────────────────────────────────────────────

[notification]
monitors = ["DP-1"]
position = "top_right"
max_visible = 5
enable_daemon = true

# ──────────────────────────────────────────────
# Lock screen
# ──────────────────────────────────────────────

[lock]
command = "swaylock"
idle_timeout = 300
before_sleep = true

[lockscreen]
monitors = ["DP-1"]

# ──────────────────────────────────────────────
# Wallpaper
# ──────────────────────────────────────────────

[wallpaper]
enabled = true
directory = "~/Pictures/Wallpapers"
mode = "fill"
interval = 300
transition = "fade"

# ──────────────────────────────────────────────
# Dock
# ──────────────────────────────────────────────

[dock]
enabled = false

# ──────────────────────────────────────────────
# OSD (volume/brightness overlays)
# ──────────────────────────────────────────────

[osd]
enabled = true
volume = true
brightness = true
timeout = 2000

# ──────────────────────────────────────────────
# Clipboard
# ──────────────────────────────────────────────

[clipboard]
enabled = true
max_entries = 100
encrypted = true

# ──────────────────────────────────────────────
# Theming
# ──────────────────────────────────────────────

[theme]
source = "custom"
custom_palette = "omarchy"
mode = "dark"
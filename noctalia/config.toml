# Noctarchy — Noctalia config
# https://github.com/deoxizn/noctarchy
#
# NOTE (v5): [general] default-apps and [launcher] command were removed upstream.
# Defaults live in omarchy/xdg-settings (noctarchy-defaults); fuzzel runs from its keybind.

# ──────────────────────────────────────────────
# Shell
# ──────────────────────────────────────────────

[shell]
time_format = "{:%-I:%M %p}"
clipboard_enabled = true
clipboard_history_max_entries = 100

[shell.animation]
enabled = false

# ──────────────────────────────────────────────
# Bar
# ──────────────────────────────────────────────

[bar.default]
position = "top"
thickness = 40
background_opacity = 0.95
reserve_space = true
start  = ["launcher", "wallpaper", "workspaces", "spacer", "active_window"]
center = ["clock"]
end    = ["bongocat", "notifications", "clipboard", "media", "tray", "network", "bluetooth", "brightness", "battery", "yuuto/arch-updater:widget", "sysmon-cpu", "sysmon-ram", "sysmon-temp", "sysmon-disk", "sysmon-net", "control-center"]

[bar.default.monitor.HDMI-A-1]
match = "HDMI-A-1"
start  = ["workspaces"]
center = []
end    = []

[bar.widgets]
enabled = false

[widget.clock]
format = "{:%-I:%M %p}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.bongocat]
type = "noctalia/bongocat:cat"
input_devices = [
  "/dev/input/by-id/usb-Keychron_Keychron_Q6_Max-event-kbd",
  "/dev/input/by-id/usb-Keychron_Keychron_Link-if02-event-kbd",
]
audio_spectrum = true
tappy_mode = true
rave_mode = false
use_mpris_filter = false

[widget.sysmon-cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "graph"
show_value = true

[widget.sysmon-ram]
type = "sysmon"
stat = "ram_pct"
show_value = true

[widget.sysmon-temp]
type = "sysmon"
stat = "cpu_temp"
show_value = true

[widget.sysmon-disk]
type = "sysmon"
stat = "disk_used_pct"
path = "/"
show_value = true

[widget.sysmon-net]
type = "sysmon"
stat = "net_rx"
network_speed_compact = true
show_value = true

[widget.spacer]
type = "spacer"
length = 8

[widget.active_window]
show_empty_label = true
display = "icon_and_text"
title_scroll = "on_hover"
max_length = 260

[widget.taskbar]
show_all_outputs = false
show_window_title = true
window_title_max_width = 180
show_active_indicator = true

# ──────────────────────────────────────────────
# System Monitor
# ──────────────────────────────────────────────

[system.monitor]
enabled = true
cpu_poll_seconds = 2.0
gpu_poll_seconds = 5.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0
disk_poll_seconds = 10.0

# ──────────────────────────────────────────────
# Notifications
# Per https://docs.noctalia.dev/noctalia/services/notifications/
# monitors = [] clones to all outputs (default). Set to ["DP-1"] to
# suppress toasts on HDMI-A-1 (portrait). Falls back to all if DP-1 disconnected.
# ──────────────────────────────────────────────

[notification]
monitors = ["DP-1"]
position = "top_right"
max_visible = 5
enable_daemon = true

# ──────────────────────────────────────────────
# Lock screen (v5: idle auto-lock lives under [idle.behavior.lock];
# before_sleep is lockscreen.lock_before_suspend, default true)
# ──────────────────────────────────────────────

[idle.behavior.lock]
enabled = true
timeout = 300.0

[lockscreen]
monitors = ["DP-1"]

# ──────────────────────────────────────────────
# Wallpaper
# ──────────────────────────────────────────────

[wallpaper]
enabled = true
directory = "~/Pictures/Wallpapers"
fill_mode = "crop"
transition = "fade"

[wallpaper.automation]
enabled = true
interval_seconds = 300

# ──────────────────────────────────────────────
# Dock
# ──────────────────────────────────────────────

[dock]
enabled = false

# ──────────────────────────────────────────────
# OSD (volume/brightness overlays)
# ──────────────────────────────────────────────

[osd]
enabled = true

# ──────────────────────────────────────────────
# Theming
# ──────────────────────────────────────────────

[theme]
source = "custom"
custom_palette = "hexciri"
mode = "dark"
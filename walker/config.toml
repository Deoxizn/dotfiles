force_keyboard_focus = true                                         # forces keyboard focus to stay in Walker
selection_wrap = true                                               # wrap list if at bottom or top
theme = "omarchy-default"                                           # theme to use
additional_theme_location = "~/.local/share/omarchy/default/walker/themes/"
hide_action_hints = false                                           # SET TO FALSE to show the shortcuts at the bottom

[layout]
ui = "vertical"                                                     # Standard vertical layout for list + hints

[placeholders]
"default" = { input = " Search...", list = "No Results" }          # placeholders for input and empty list

[keybinds]
quick_activate = []

[columns]
symbols = 1                                                         # providers to be queried by default

[providers.actions]
websearch = [
  { action = "search", default = true, bind = "Return" },
  { action = "Brave", default = true, bind = "Return" },
  { action = "YouTube", bind = "ctrl y" },
  { action = "AUR", bind = "ctrl shift a" },
  { action = "Arch Packages", bind = "ctrl a" },
  { action = "Arch Wiki", bind = "ctrl alt a" },
]

[providers]
max_results = 256                                                   # 256 should be enough for everyone
default = [
  "desktopapplications",
  "websearch",
]

[[providers.prefixes]]
prefix = "/"
provider = "providerlist"

[[providers.prefixes]]
prefix = "."
provider = "files"

[[providers.prefixes]]
prefix = ":"
provider = "symbols"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = "$"
provider = "clipboard"

[[emergencies]]
text = "Restart Walker"
command = "omarchy-restart-walker"

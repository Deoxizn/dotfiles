# Hexciri — Noctalia config (Noctalia v5 schema)
# https://github.com/deoxizn/hexciri
#
# Note: v5 removed several v4 sections ([general] default apps, [launcher]
# command, [lock], [clipboard]). Default apps live in xdg-settings + state
# (see hexciri-defaults); the lock screen is internal (see hexciri-lock).

# ──────────────────────────────────────────────
# Bar
# Widget IDs are v5 names (spacer, active_window, ...). Per-widget settings
# live in [widget.<name>] tables below.
#
# Composition: mirrors the daily bar (launcher, wallpaper, workspaces,
# active_window, clock, notifications, clipboard, tray, network, bluetooth,
# volume, brightness, battery, arch-updater, control-center/settings owl).
# Deliberately removed: bongo-cat and the sysmon stack (cpu/ram/temp/disk/net)
# — clutter that duplicates system monitors. Volume stays (everyone needs it),
# brightness stays (laptops). Edit freely; install.sh never overwrites a file
# you've modified (repo default lands alongside as <file>.hexciri).
# ──────────────────────────────────────────────

[bar.default]
position = "top"
thickness = 40                        # Bar height in pixels
background_opacity = 0.0             # 0.0 = transparent, 1.0 = opaque
reserve_space = true                  # Reserve screen space (don't overlap windows)
# Islands look: floating, detached pill bar
margin_edge = 10                      # Float 10px off the top edge (requires concave_edge_corners = false)
margin_ends = 10                      # Inset 10px from left/right ends for island effect
concave_edge_corners = false          # Must be false when margin_edge > 0 (concave only works docked at margin_edge = 0)
radius = 16                           # Uniform rounding for all four floating corners
padding = 10                          # Internal main-axis padding
widget_spacing = 4                    # Tighter gaps for pill grouping
capsule = true                        # Pill background on every widget
capsule_fill = "surface_variant"
capsule_thickness = 0.76              # Capsule height as fraction of thickness
contact_shadow = true                 # Seamless lift where attached panels meet the bar
panel_overlap = 1                     # Default seam overlap; try 0 if you see a hairline, raise if you see a gap
start  = ["launcher", "wallpaper", "workspaces", "spacer", "media"]
center = ["active_window", "spacer_2", "clock"]
end    = ["notifications", "clipboard", "tray", "network", "bluetooth", "volume", "brightness", "battery", "yuuto/arch-updater:widget", "control-center"]

[widget.workspaces]
hide_when_empty = true                 # Only show workspaces that have windows/apps
                                       # (workspaces are global per-monitor, so this keeps
                                       # every output's bar tidy)
urgent_color = "secondary"             # Urgent highlight off: urgent pills wear
                                       # the occupied color
show_labels = true                     # Draw text labels (false = unlabeled pills)
label_source = "name"                  # "name" = Hyprland default_name, "id" = number
max_label_chars = 5                    # v5 default is 1 — that's why you only saw
                                       # first letters ("web" → "w"). 5 covers
                                       # files/music, the longest names below.

[widget.clock]
format = "{:%I:%M %p}"                 # 12-hour time, e.g. 02:30 PM (see date-format-tokens in Noctalia docs)
tooltip_format = "{:%A, %d %B %Y}"    # Full date on hover

[widget.spacer]
type = "spacer"
length = 8                            # Gap in pixels between workspaces and window title

[widget.spacer_2]
type = "spacer"

[widget.active_window]
show_empty_label = true               # Show placeholder when no window is focused
display = "icon_and_text"             # App icon + title (alternatives: icon, text)

# ──────────────────────────────────────────────
# Shell services (clipboard history lives here in v5)
# ──────────────────────────────────────────────

[shell]
clipboard_enabled = true
clipboard_history_max_entries = 100
time_format = "{:%I:%M %p}"           # 12-hour time (Control Center / dashboard headers)

# Screenshots (Noctalia Print binds: screenshot-region / screenshot-fullscreen)
# match hexciri-compositor grim/slurp flow — empty defaults to ~/Pictures.
[shell.screenshot]
directory = "~/Pictures/Screenshots"

# ──────────────────────────────────────────────
# Notifications
# ──────────────────────────────────────────────

[notification]
position = "top_right"                # Corner for toast popups
max_visible = 5                       # Max stacked toasts
enable_daemon = true                  # Run the notification daemon

# ──────────────────────────────────────────────
# Idle → lock screen after 5 minutes
# ──────────────────────────────────────────────

[idle.behavior.lock]
enabled = true
timeout = 300.0                       # Seconds idle before locking

# ──────────────────────────────────────────────
# Wallpaper (picker + rotation use the active theme's backgrounds)
# ──────────────────────────────────────────────

[wallpaper]
enabled = true
directory = "~/.local/state/hexciri/current/theme/backgrounds"
fill_mode = "crop"                    # Fill screen, cropping overflow
transition = ["fade"]                 # Transition effect between wallpapers

[wallpaper.automation]
enabled = false                   # Rotation off — wallpaper changes only via the bar picker
interval_seconds = 3600           # Unused while automation is disabled
order = "random"

# ──────────────────────────────────────────────
# Dock (disabled — top bar only)
# ──────────────────────────────────────────────

[dock]
enabled = false

# ──────────────────────────────────────────────
# OSD (volume/brightness overlays; per-kind toggles default on)
# ──────────────────────────────────────────────

[osd]
enabled = true

# ──────────────────────────────────────────────
# Theming (custom palette generated from the hexciri theme on every
# theme switch by hooks/theme-set.d/hexciri-sync.sh)
# ──────────────────────────────────────────────

[theme]
source = "custom"
custom_palette = "hexciri"
mode = "dark"
[plugins]
enabled = ["yuuto/arch-updater"]

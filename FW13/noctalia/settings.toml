config_version = 14

[bar.default]
background_opacity = 0.0
center = [ "active_window", "spacer_2", "clock", "spacer_2", "weather" ]
end = [
    "notifications",
    "clipboard",
    "tray",
    "network",
    "volume",
    "brightness",
    "power_profile",
    "battery",
    "yuuto/arch-updater:widget",
    "bluetooth",
    "control-center"
]

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1037.3333740234375
    output = "eDP-1"
    placement_height = 1280.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."yuuto/arch-updater"]
aur_helper = "auto"
auto_check_hours = 1
flatpak_enabled = false
terminal = "kitty"
update_cmd = "hexciri-update"
update_mode = "terminal"

[shell.launcher]
categories = false
compact = true
sort_by_usage = false

[wallpaper.default]
path = "/home/devi/.local/state/hexciri/current/theme/backgrounds/zz-user-wallhaven-3q5k8y.png"

[wallpaper.last]
path = "/home/devi/.local/state/hexciri/current/theme/backgrounds/zz-user-wallhaven-3q5k8y.png"

[wallpaper.monitors.eDP-1]
path = "/home/devi/.local/state/hexciri/current/theme/backgrounds/zz-user-wallhaven-3q5k8y.png"

[weather]
unit = "imperial"

[widget.clipboard]
enabled = false

[widget.weather]
show_condition = false
config_version = 14

[bar.default]
background_opacity = 0.19999999552965164
capsule = true
capsule_fill = "surface_variant"
capsule_thickness = 0.76000000000000001
center = [ "active_window", "spacer_2", "clock", "spacer_2", "weather" ]
concave_edge_corners = false
contact_shadow = true
end = [
    "notifications",
    "clipboard",
    "tray",
    "network",
    "volume",
    "brightness",
    "power_profile",
    "battery",
    "yuuto/arch-updater:widget",
    "bluetooth",
    "control-center"
]
margin_edge = 10
margin_ends = 10
padding = 10
panel_overlap = 1
radius = 16
widget_spacing = 4

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1037.3333740234375
    output = "eDP-1"
    placement_height = 1280.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."yuuto/arch-updater"]
aur_helper = "auto"
auto_check_hours = 1
flatpak_enabled = false
terminal = "kitty --app-id=TUI.float"
update_cmd = "hexciri-update"
update_mode = "terminal"

[shell.launcher]
categories = false
compact = true
sort_by_usage = false

[shell.screenshot]
directory = "~/Pictures/Screenshots"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
custom_palette = "hexciri"
shell_mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

[wallpaper]
fill_mode = "stretch"

    [wallpaper.default]
    path = "/home/devi/.local/state/hexciri/current/theme/backgrounds/zz-user-wallhaven-j5lqe5.jpg"

    [wallpaper.last]
    path = "/home/devi/.local/state/hexciri/current/theme/backgrounds/zz-user-wallhaven-j5lqe5.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/devi/.local/state/hexciri/current/theme/backgrounds/zz-user-wallhaven-j5lqe5.jpg"

    [[wallpaper.favorite]]
    custom_palette = "hexciri"
    palette_source = "custom"
    path = "/home/devi/.local/state/hexciri/current/theme/backgrounds/zz-user-hexciri-chan-WP.png"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    path = "/home/devi/.local/state/hexciri/current/theme/backgrounds/zz-user-hexciri-chan-WP2.png"
    theme_mode = "auto"

[weather]
unit = "imperial"

[widget.clipboard]
enabled = false

[widget.media]
max_length = 250

[widget.spacer]
enabled = false
length = 5

[widget.spacer_2]
enabled = false
length = 5

[widget.weather]
show_condition = false
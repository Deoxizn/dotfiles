# Machine-local (this laptop only) — Wi-Fi power save off.
# Second cause of the BT A2DP audio dropouts; runtime-only before, so it did
# not survive reconnect/reboot. 2 = disable (0=default 1=ignore 2=disable 3=enable).
# Revert: rm /etc/NetworkManager/conf.d/90-wifi-powersave-off.conf
[connection]
wifi.powersave=2

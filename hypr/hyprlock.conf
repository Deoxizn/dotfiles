# Input Field
input-field {
    monitor = DP-1
    size = 220, 40
    outline_thickness = 3
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(888888)
    inner_color = rgb(C1C1C1)
    font_color = rgb(888888)
    fade_on_empty = true
    fade_timeout = 1000
    rounding = -1
    check_color = rgb(A06666)
    placeholder_text = <i><span foreground="##cdd6f4">Input Password...</span></i>
    hide_input = false
    grace = o
    position = 0, -170
    halign = center
    valign = center
}

# Date
label {
  monitor = DP-1
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgb(f1f1f1)
  font_size = 22
  font_family = JetBrains Mono Nerd Font ExtraBold Italic
  position = -18, 1235
  halign = center
  valign = bottom
  shadow_passes = 2
  shadow_color = rgb(0,0,0)
  shadow_boost = 1.2
}

# Time
label {
  monitor = DP-1
  text = cmd[update:1000] echo "$(date +"%-I:%M")"
  color = rgb(C1C1C1)
  font_size = 96
  font_family = JetBrains Mono Nerd Font ExtraBold Italic
  position = 0, 270
  halign = center
  valign = center
  shadow_passes = 2
  shadow_color = rgb(0,0,0)
  shadow_boost = 1.2
}




# User
label {
    monitor = DP-1
    text =  $USER
    color = rgb(888888)
    font_size = 15
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, -210
    halign = center
    valign = center
}

# uptime days
label {
    monitor = DP-1
    text = cmd[update:60000] echo "<b> "$( $Scripts/Uptime.sh)" </b>"
    color = rgb(C1C1C1)
    font_size = 15
    font_family = JetBrains Mono Nerd Font ExtraBold Italic
    position = 0, 30
    halign = center
    valign = bottom
}

# uptime hours and minutes
label {
    monitor = DP-1
    text = cmd[update:60000] echo "<b> "$( $Scripts/Uptimehm.sh)" </b>"
    color = rgb(C1C1C1)
    font_size = 15
    font_family = JetBrains Mono Nerd Font ExtraBold Italic
    position = 0, 50
    halign = center
    valign = bottom
}


# weather
label {
   monitor = DP-1
   text = cmd[update:1800000] echo "<b> "$( $Scripts/weather.sh)" </b>"
   color = rgb(C1C1C1)
   font_size = 16
   font_family = JetBrains Mono Nerd Font ExtraBold Italic
   position = 0, 80
   halign = center
   valign = bottom
}

# song info
label {
    monitor = DP-1
    text = cmd[update:1000] echo "<b> "$( $Scripts/song.sh)" </b>"
    font_size = 15
    font_family = JetBrains Mono Nerd Font ExtraBold Italic
    color = rgb(C1C1C1)
    position = 0, 400

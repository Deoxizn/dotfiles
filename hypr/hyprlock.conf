# Hyprlock
# Original config submitted by https://github.com/SherLock707

$Scripts = $HOME/.config/hypr/scripts

general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
    immediate_render = false  # ← Wait for resources (default, but good to be explicit)
}

background {
    monitor = DP-1
	#path = screenshot   # screenshot of your desktop
	path = $HOME/Pictures/wallpaper/wallhaven-mlzzx8.png   # NOTE only png supported for now
    #color = $color7

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_passes = 0
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

background {
    monitor = HDMI-A-1
	#path = screenshot   # screenshot of your desktop
	path = $HOME/Pictures/wallpaper/11.png   # NOTE only png supported for now
    #color = $color7

    blur_passes = 0
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}


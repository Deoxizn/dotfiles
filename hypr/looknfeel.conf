# Change the default Omarchy look'n'feel

# https://wiki.hypr.land/Configuring/Basics/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    # Change to niri-like side-scrolling layout
    # layout = scrolling
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
    # Disable all animations
    # enabled = no
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    # See only one column per screen instead of two
    # column_width = 0.97
}

# Transparency Override
windowrule = opacity 1.0 override 1.0 override, match:title ^(.*YouTube.*|.*Plex.*|.*Instagram.*)$

# Games
windowrule = opacity 1.0 override 1.0 override, match:title ^(World of Warcraft|Cult Of The Lamb|Hollow Knight)$


#Game Tweaks
windowrule = match:title World of Warcraft, immediate yes
windowrule = match:title Cult Of The Lamb, immediate yes
windowrule = match:title Hollow Knight, immediate yes

#decoration {
    active_opacity                                         = 1.0
    border_part_of_window                                  = true
    dim_around                                             = 0.4
    dim_modal                                              = true
    dim_special                                            = 0.2
    dim_strength                                           = 0.1
    dim_inactive                                           = true
    fullscreen_opacity                                     = 1.0
    inactive_opacity                                       = 0.15
    rounding                                               = 20
    rounding_power                                         = 2.0
    screen_shader =
#blur {
    brightness                                             = 1.0
    contrast                                               = 1.0
    enabled                                                = false
    ignore_opacity                                         = true
    input_methods                                          = true
    input_methods_ignorealpha                              = 0.2
    new_optimizations                                      = true
    noise                                                  = 0.01
    passes                                                 = 4
    popups = true
    popups_ignorealpha = 0.6
    size = 14
    special = true
    vibrancy = 1.5
    vibrancy_darkness = 1.5
    xray = true
#    }
#shadow {
    color                                                  = 0xee1a1a1a
    #color_inactive                                         =
    enabled                                                = true
    ignore_window                                          = true
    offset                                                 = 0 2
    range                                                  = 20
    render_power                                           = 4
    scale                                                  = 1.0
    sharp                                                  = false
#    }
#}


#terminal float
windowrule = float on, match:class kitty
windowrule = size 1600 600, match:class kitty

# Floating windows
windowrule = tag +floating-window, match:class (org.omarchy.bluetui|org.omarchy.impala|org.omarchy.wiremix|org.omarchy.btop|org.omarchy.terminal|org.omarchy.bash|org.gnome.NautilusPreviewer|org.gnome.Evince|com.gabm.satty|Omarchy|About|TUI.float|imv|mpv)
windowrule = tag +floating-window, match:class (xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org.gnome.Nautilus), match:title ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[C|c]hoose.*)
windowrule = float on, match:tag floating-window
windowrule = size 1000 720, match:tag floating-window
windowrule = center on, match:tag floating-window

windowrule = float on, match:class org.gnome.Calculator
